# Modified by the featherbit authors for feathercritty; see README.md for the list of changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses nightly-only options, as upstream does.
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Differential test against alacritty_terminal 0.26.0 (tests/differential.rs), run in
      # debug by the `cargo test` steps below: seeds per pass and steps per random seed.
      DIFF_SEEDS: 300
      DIFF_STEPS: 400
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      # The differential test in release with tiny history blocks (256 bytes) and a reflow window
      # of one row, so block boundaries, spares, oversized rows and the reflow's decode-back path
      # are crossed all the time (see tests/differential.rs).
      - name: differential test, tiny blocks (release)
        run: cargo test --locked --release --test differential
        env:
          DIFF_TINY: 1
      # Large histories (tests/large_history.rs, all #[ignore]). The 100,000-line comparison
      # against 0.26.0 holds two full snapshots (peak RSS measured at 3.9 GB), which fits the
      # Linux and macOS runners; Windows runs neither. large_history_cost_table is manual.
      - name: large history tests (release, Linux and macOS)
        if: runner.os != 'Windows'
        run: >-
          cargo test --locked --release --test large_history -- --ignored --exact
          large_history_matches_oracle_at_100k large_history_invariants_at_1m
