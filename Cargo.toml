# Modified by the featherbit authors for feathercritty; see README.md for the list of changes.

[package]
name = "feathercritty"
# The alacritty_terminal release this fork is based on, plus the fork's own revision as build
# metadata; see README.md.
version = "0.26.0+fbterm.4"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
license = "Apache-2.0"
description = "Terminal emulation library for featherbit terminal, forked from alacritty_terminal"
readme = "README.md"
homepage = "https://github.com/featherbitplatform/feathercritty"
repository = "https://github.com/featherbitplatform/feathercritty"
edition = "2024"
rust-version = "1.85.0"
publish = false

[features]
default = ["serde"]
serde = ["dep:serde", "bitflags/serde", "vte/serde"]

[dependencies]
base64 = "0.22.0"
bitflags = "2.4.1"
home = "0.5.5"
libc = "0.2"
log = "0.4"
parking_lot = "0.12.0"
polling = "3.8.0"
regex-automata = "0.4.3"
unicode-width = "0.2.0"
vte = { version = "0.15.0", default-features = false, features = ["std", "ansi"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"
rustix = { version = "1.0.0", default-features = false, features = ["std"] }
signal-hook = "0.4.3"

[target.'cfg(windows)'.dependencies]
piper = "0.2.1"
miow = "0.6.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]}

[dev-dependencies]
serde_json = "1.0.0"
# The oracle of tests/differential.rs: the published 0.26.0 source with the patches listed in
# tests/oracle/PATCHES.md (checked by tests/oracle_pristine.rs).
alacritty_terminal = { path = "tests/oracle" }
# ChaCha keeps generated test cases identical on every platform.
rand = "0.8"
rand_chacha = "0.3"
# Checks that a match the fork returns where 0.26.0 cannot answer is a real match (the library
# already depends on this crate).
regex-automata = "0.4.3"

# Benchmarks print their own tables (and take `--gate`), so they bring their own `main`.
[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "reads"
harness = false

[[example]]
name = "memory"
